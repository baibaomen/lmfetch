[project]
name = "lmfetch"
version = "0.1.0"
description = "Image fetch + cache sidecar for OpenAI-compatible vision APIs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "baibaomen", email = "baibaomen@gmail.com" }]
keywords = ["llm", "vision", "cache", "proxy", "openai", "llama.cpp", "vllm"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pillow>=10.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[project.scripts]
lmfetch = "lmfetch.cli:main"

[project.urls]
Homepage = "https://github.com/baibaomen/lmfetch"
Issues = "https://github.com/baibaomen/lmfetch/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmfetch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
