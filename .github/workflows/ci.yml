name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.5.11
      - name: Install package + dev deps
        run: uv pip install --system -e ".[dev]"
      - name: Run unit tests (e2e tests skip without LMFETCH_E2E_* env)
        run: pytest -q
