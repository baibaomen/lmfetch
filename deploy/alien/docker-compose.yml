# lmfetch on alien — sits between new-api (llm-dev.baibaomen.com) and
# local-llm-server (llama.cpp + Qwen3.6-35B-A3B + mmproj).
#
# Wiring:
#   new-api channel "local-qwen3.6-35b-a3b"  base_url=http://lmfetch:8000
#       │
#       └─►  lmfetch  upstream=http://local-llm-server:8080
#                │
#                └─► local-llm-server (llama.cpp)
#
# Both new-api (llm-dev-newapi) and local-llm-server already live on
# llm-devbaibaomencom_newapi-internal — lmfetch joins the same network so
# DNS just resolves "lmfetch" / "local-llm-server" by container name.
#
# Cache survives container rebuilds via the bind mount ./cache → /var/lib/lmfetch/cache.

name: lmfetch

services:
  lmfetch:
    image: lmfetch:latest
    container_name: lmfetch
    restart: unless-stopped
    environment:
      LMFETCH_UPSTREAM_URL: "http://local-llm-server:8080"
      LMFETCH_CACHE_DIR: "/var/lib/lmfetch/cache"
      LMFETCH_CACHE_MAX_BYTES: "10737418240"   # 10 GiB
      LMFETCH_HOST: "0.0.0.0"
      LMFETCH_PORT: "8000"
    volumes:
      - ./cache:/var/lib/lmfetch/cache
    networks:
      - newapi-internal
    expose:
      - "8000"

networks:
  # Pre-existing network created by /data/llm-dev.baibaomen.com/docker-compose.yml.
  # Joining as external avoids re-creating it; both new-api and local-llm-server
  # are already attached.
  newapi-internal:
    external: true
    name: llm-devbaibaomencom_newapi-internal
